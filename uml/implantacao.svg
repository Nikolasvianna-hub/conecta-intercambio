<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1350 960" width="100%" height="100%" style="background-color: #ffffff; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <style>
      .node-box { fill: #f8fafc; stroke-width: 2; filter: drop-shadow(0 4px 6px rgba(0,0,0,0.06)); }
      .node-inner { fill: #ffffff; stroke-width: 1.5; rx: 6; }
      .node-stereo { font-size: 10px; font-style: italic; fill: #64748b; text-anchor: middle; }
      .node-title { font-size: 13px; font-weight: bold; fill: #0f172a; text-anchor: middle; }
      .node-sub { font-size: 10px; fill: #475569; text-anchor: middle; }
      .art-box { fill: #ffffff; stroke-width: 1.2; rx: 4; stroke: #94a3b8; }
      .art-title { font-size: 11px; font-weight: bold; fill: #1e293b; text-anchor: middle; }
      .art-sub { font-size: 9.5px; fill: #64748b; text-anchor: middle; }
      .proto-line { stroke-width: 2; fill: none; }
      .proto-badge { fill: #ffffff; stroke-width: 1.5; rx: 6; filter: drop-shadow(0 2px 4px rgba(0,0,0,0.08)); }
      .proto-text { font-size: 10px; font-weight: bold; text-anchor: middle; }
      .proto-sub { font-size: 8.5px; text-anchor: middle; fill: #475569; }
    </style>
    <marker id="arrow-blue-dep" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#2563eb" />
    </marker>
    <marker id="arrow-green-dep" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#15803d" />
    </marker>
  </defs>

  <!-- TÍTULO DO DIAGRAMA -->
  <text x="675" y="35" font-size="18" font-weight="bold" fill="#0f172a" text-anchor="middle">Diagrama de Implantação — Conecta Intercâmbio</text>
  <text x="675" y="52" font-size="12" fill="#64748b" text-anchor="middle">Topologia Física, Nós de Processamento, Ambientes de Execução e Protocolos de Rede | UML 2.5</text>

  <!-- ============================================== -->
  <!-- NÓ 1: DISPOSITIVO DO CLIENTE                   -->
  <!-- ============================================== -->
  <g id="node-client">
    <!-- Caixa 3D do Nó Device -->
    <path d="M 40 100 L 340 100 L 360 80 L 60 80 Z" fill="#e2e8f0" stroke="#0284c7" stroke-width="2" />
    <path d="M 340 100 L 360 80 L 360 480 L 340 500 Z" fill="#cbd5e1" stroke="#0284c7" stroke-width="2" />
    <rect x="40" y="100" width="300" height="400" class="node-box" style="stroke: #0284c7;" />
    
    <text x="190" y="125" class="node-stereo">&lt;&lt;device&gt;&gt;</text>
    <text x="190" y="142" class="node-title" fill="#0369a1">Dispositivo do Usuário</text>
    <text x="190" y="158" class="node-sub">Smartphone / Notebook / Desktop</text>

    <!-- Ambiente de Execução: Navegador Web -->
    <rect x="60" y="180" width="260" height="290" class="node-inner" style="stroke: #0284c7; fill: #f0f9ff;" />
    <text x="190" y="202" class="node-stereo">&lt;&lt;execution environment&gt;&gt;</text>
    <text x="190" y="218" class="node-title" font-size="12">Navegador Web</text>
    <text x="190" y="232" class="node-sub">(Chrome, Safari, Firefox, Edge)</text>

    <!-- Artefato 1: Bundle SPA -->
    <rect x="75" y="250" width="230" height="75" class="art-box" style="stroke: #0284c7;" />
    <text x="190" y="270" class="node-stereo">&lt;&lt;artifact&gt;&gt;</text>
    <text x="190" y="287" class="art-title">conecta-app.bundle.js</text>
    <text x="190" y="303" class="art-sub">HTML5, CSS3 Responsivo, i18n JSON</text>
    <text x="190" y="316" class="art-sub">Componentes de UI e Estado</text>

    <!-- Artefato 2: Armazenamento Local -->
    <rect x="75" y="340" width="230" height="75" class="art-box" style="stroke: #0284c7;" />
    <text x="190" y="360" class="node-stereo">&lt;&lt;artifact&gt;&gt;</text>
    <text x="190" y="377" class="art-title">LocalStorage / IndexedDB</text>
    <text x="190" y="393" class="art-sub">Tokens JWT de Sessão Criptografados</text>
    <text x="190" y="406" class="art-sub">Cache de Idioma (pt-BR / en-US)</text>
  </g>

  <!-- ============================================== -->
  <!-- NÓ 2: SERVIDOR DE APLICAÇÃO WEB / NUVEM        -->
  <!-- ============================================== -->
  <g id="node-cloud-app">
    <path d="M 480 100 L 860 100 L 880 80 L 500 80 Z" fill="#e2e8f0" stroke="#2563eb" stroke-width="2" />
    <path d="M 860 100 L 880 80 L 880 580 L 860 600 Z" fill="#cbd5e1" stroke="#2563eb" stroke-width="2" />
    <rect x="480" y="100" width="380" height="500" class="node-box" style="stroke: #2563eb;" />

    <text x="670" y="125" class="node-stereo">&lt;&lt;execution environment&gt;&gt;</text>
    <text x="670" y="142" class="node-title" fill="#1d4ed8">Servidor de Aplicação Web (Cloud Host)</text>
    <text x="670" y="158" class="node-sub">Ambiente de Hospedagem / Container Linux</text>

    <!-- Ambiente de Execução Nginx -->
    <rect x="505" y="175" width="330" height="105" class="node-inner" style="stroke: #2563eb; fill: #eff6ff;" />
    <text x="670" y="195" class="node-stereo">&lt;&lt;execution environment&gt;&gt;</text>
    <text x="670" y="210" class="node-title" font-size="11.5">Servidor Web Reverso (Nginx / Caddy)</text>
    <text x="670" y="224" class="node-sub">Terminação TLS 1.3, Roteamento, Compactação Gzip</text>

    <rect x="525" y="235" width="290" height="36" class="art-box" style="stroke: #2563eb;" />
    <text x="670" y="257" class="art-title" font-size="10.5">&lt;&lt;artifact&gt;&gt; /dist (Arquivos Estáticos da Aplicação)</text>

    <!-- Ambiente de Execução Backend Runtime -->
    <rect x="505" y="300" width="330" height="280" class="node-inner" style="stroke: #2563eb; fill: #eff6ff;" />
    <text x="670" y="322" class="node-stereo">&lt;&lt;execution environment&gt;&gt;</text>
    <text x="670" y="338" class="node-title" font-size="11.5">Backend Runtime (Node.js / Docker Host)</text>
    <text x="670" y="352" class="node-sub">Camada de Serviços RESTful e Regras de Negócio</text>

    <!-- Artefatos de Backend -->
    <rect x="525" y="365" width="290" height="60" class="art-box" style="stroke: #2563eb;" />
    <text x="670" y="383" class="node-stereo">&lt;&lt;artifact&gt;&gt;</text>
    <text x="670" y="398" class="art-title">conecta-api-server.bin</text>
    <text x="670" y="413" class="art-sub">Módulos: Auth, Profile, Feed, News, Buddy, Events</text>

    <rect x="525" y="435" width="290" height="60" class="art-box" style="stroke: #dc2626;" />
    <text x="670" y="453" class="node-stereo">&lt;&lt;artifact&gt;&gt;</text>
    <text x="670" y="468" class="art-title" fill="#991b1b">moderation-engine.bin</text>
    <text x="670" y="483" class="art-sub">Triagem de Denúncias, Auditoria LGPD e Logs</text>

    <rect x="525" y="505" width="290" height="55" class="art-box" style="stroke: #15803d;" />
    <text x="670" y="523" class="node-stereo">&lt;&lt;artifact&gt;&gt;</text>
    <text x="670" y="538" class="art-title" fill="#166534">data-access-orm.bin</text>
    <text x="670" y="551" class="art-sub">Pool de Conexões e Repositórios SQL</text>
  </g>

  <!-- ============================================== -->
  <!-- NÓ 3: SERVIDOR DE BANCO DE DADOS               -->
  <!-- ============================================== -->
  <g id="node-database">
    <path d="M 980 100 L 1280 100 L 1300 80 L 1000 80 Z" fill="#e2e8f0" stroke="#15803d" stroke-width="2" />
    <path d="M 1280 100 L 1300 80 L 1300 320 L 1280 340 Z" fill="#cbd5e1" stroke="#15803d" stroke-width="2" />
    <rect x="980" y="100" width="300" height="240" class="node-box" style="stroke: #15803d;" />

    <text x="1130" y="125" class="node-stereo">&lt;&lt;device&gt;&gt;</text>
    <text x="1130" y="142" class="node-title" fill="#166534">Servidor de Banco de Dados</text>
    <text x="1130" y="158" class="node-sub">Instância Gerenciada em VPC Privada</text>

    <rect x="1000" y="175" width="260" height="145" class="node-inner" style="stroke: #15803d; fill: #f0fdf4;" />
    <text x="1130" y="195" class="node-stereo">&lt;&lt;execution environment&gt;&gt;</text>
    <text x="1130" y="210" class="node-title" font-size="11.5">SGBD Relacional (PostgreSQL 15+)</text>

    <rect x="1015" y="225" width="230" height="75" class="art-box" style="stroke: #15803d;" />
    <text x="1130" y="245" class="node-stereo">&lt;&lt;artifact&gt;&gt;</text>
    <text x="1130" y="260" class="art-title">conecta_schema.sql</text>
    <text x="1130" y="275" class="art-sub">Tabelas: users, profiles, posts,</text>
    <text x="1130" y="288" class="art-sub">buddies, news, reports, audit_logs</text>
  </g>

  <!-- ============================================== -->
  <!-- NÓ 4: ARMAZENAMENTO DE ARQUIVOS E MÍDIAS (S3)   -->
  <!-- ============================================== -->
  <g id="node-storage">
    <path d="M 980 400 L 1280 400 L 1300 380 L 1000 380 Z" fill="#e2e8f0" stroke="#15803d" stroke-width="2" />
    <path d="M 1280 400 L 1300 380 L 1300 620 L 1280 640 Z" fill="#cbd5e1" stroke="#15803d" stroke-width="2" />
    <rect x="980" y="400" width="300" height="240" class="node-box" style="stroke: #15803d;" />

    <text x="1130" y="425" class="node-stereo">&lt;&lt;device&gt;&gt;</text>
    <text x="1130" y="442" class="node-title" fill="#166534">Servidor de Armazenamento</text>
    <text x="1130" y="458" class="node-sub">Cloud Object Storage / Bucket S3 / CDN</text>

    <rect x="1005" y="480" width="250" height="135" class="art-box" style="stroke: #15803d; fill: #f0fdf4;" />
    <text x="1130" y="505" class="node-stereo">&lt;&lt;artifact&gt;&gt;</text>
    <text x="1130" y="522" class="art-title">Bucket de Mídias (/media-conecta)</text>
    <text x="1130" y="542" class="art-sub">• Fotos de Perfil dos Estudantes</text>
    <text x="1130" y="558" class="art-sub">• Imagens de Publicações e Eventos</text>
    <text x="1130" y="574" class="art-sub">• Anexos em PDF de Editais Oficiais NEI</text>
    <text x="1130" y="590" class="art-sub">• Vídeos Curtos Acadêmicos (Até 60s)</text>
  </g>

  <!-- ============================================== -->
  <!-- NÓ 5: SERVIÇO EXTERNO DE E-MAIL INSTITUCIONAL   -->
  <!-- ============================================== -->
  <g id="node-smtp">
    <path d="M 480 680 L 860 680 L 880 660 L 500 660 Z" fill="#fef9c3" stroke="#ca8a04" stroke-width="2" />
    <path d="M 860 680 L 880 660 L 880 820 L 860 840 Z" fill="#fef08a" stroke="#ca8a04" stroke-width="2" />
    <rect x="480" y="680" width="380" height="160" class="node-box" style="stroke: #ca8a04; fill: #fefce8;" />

    <text x="670" y="705" class="node-stereo">&lt;&lt;execution environment&gt;&gt;</text>
    <text x="670" y="722" class="node-title" fill="#854d0e">Servidor SMTP de Mensageria / E-mail</text>
    <text x="670" y="738" class="node-sub">Infraestrutura Externa Institucional (Unifor Mail)</text>

    <rect x="510" y="755" width="320" height="65" class="art-box" style="stroke: #ca8a04;" />
    <text x="670" y="775" class="node-stereo">&lt;&lt;artifact&gt;&gt;</text>
    <text x="670" y="792" class="art-title">Mail Notification Dispatcher</text>
    <text x="670" y="806" class="art-sub">Envio de confirmação de cadastro e alertas</text>
  </g>

  <!-- ============================================== -->
  <!-- CAMINHOS DE COMUNICAÇÃO E PROTOCOLOS DE REDE   -->
  <!-- ============================================== -->
  <!-- 1. Cliente -> Servidor Web (HTTPS / TLS 1.3) -->
  <line x1="340" y1="280" x2="480" y2="280" class="proto-line" style="stroke: #0284c7;" />
  <rect x="360" y="248" width="100" height="42" class="proto-badge" style="stroke: #0284c7;" />
  <text x="410" y="265" class="proto-text" fill="#0369a1">&lt;&lt;protocol&gt;&gt;</text>
  <text x="410" y="278" class="proto-text" fill="#0284c7">HTTPS / TLS 1.3</text>
  <text x="410" y="288" class="proto-sub">Porta 443 (TCP/IP)</text>

  <!-- 2. Servidor Web -> Banco de Dados (TCP/IP Privado Porta 5432) -->
  <path d="M 860 220 L 980 220" class="proto-line" style="stroke: #15803d;" />
  <rect x="880" y="190" width="85" height="40" class="proto-badge" style="stroke: #15803d;" />
  <text x="922" y="206" class="proto-text" fill="#15803d">&lt;&lt;protocol&gt;&gt;</text>
  <text x="922" y="218" class="proto-text" fill="#15803d">TCP/IP Privado</text>
  <text x="922" y="228" class="proto-sub">Porta 5432 / TLS</text>

  <!-- 3. Servidor Web -> Armazenamento S3 (HTTPS / S3 API Porta 443) -->
  <path d="M 860 520 L 980 520" class="proto-line" style="stroke: #15803d;" />
  <rect x="880" y="490" width="85" height="40" class="proto-badge" style="stroke: #15803d;" />
  <text x="922" y="506" class="proto-text" fill="#15803d">&lt;&lt;protocol&gt;&gt;</text>
  <text x="922" y="518" class="proto-text" fill="#15803d">HTTPS S3 API</text>
  <text x="922" y="528" class="proto-sub">Porta 443 / REST</text>

  <!-- 4. Servidor Web -> Servidor SMTP (SMTP TLS Porta 587) -->
  <line x1="670" y1="600" x2="670" y2="680" class="proto-line" style="stroke: #ca8a04;" />
  <rect x="620" y="620" width="100" height="40" class="proto-badge" style="stroke: #ca8a04;" />
  <text x="670" y="636" class="proto-text" fill="#854d0e">&lt;&lt;protocol&gt;&gt;</text>
  <text x="670" y="648" class="proto-text" fill="#ca8a04">SMTP / STARTTLS</text>
  <text x="670" y="658" class="proto-sub">Porta 587</text>

  <!-- NOTA DE PREMISSA ARQUITETURAL NO RODAPÉ -->
  <rect x="180" y="880" width="990" height="45" rx="6" fill="#f8fafc" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3 3" />
  <text x="675" y="900" font-size="11" font-weight="bold" fill="#334155" text-anchor="middle">Nota de Premissa Arquitetural:</text>
  <text x="675" y="915" font-size="10" fill="#64748b" text-anchor="middle">A infraestrutura modelada representa a arquitetura física conceitual proposta para a Sprint 1. As tecnologias específicas (PostgreSQL, Nginx, Node.js e S3) foram adotadas como premissas de projeto e dependem de homologação da infraestrutura de TI da Unifor.</text>
</svg>
