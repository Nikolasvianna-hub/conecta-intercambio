<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 860" width="100%" height="100%" style="background:#ffffff;font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif">
  <defs>
    <marker id="open" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0,0 L10,5 L0,10" fill="none" stroke="#2563eb" stroke-width="1.5"/></marker>
    <marker id="openg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0,0 L10,5 L0,10" fill="none" stroke="#475569" stroke-width="1.5"/></marker>
    <marker id="tri" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="12" markerHeight="12" orient="auto"><path d="M0,0 L12,6 L0,12 Z" fill="#fff" stroke="#1e293b" stroke-width="1.2"/></marker>
    <style>
      .b{fill:#f8fafc;stroke:#334155;stroke-width:2.5}
      .t{font-size:16px;font-weight:700;fill:#0f172a}
      .uc{fill:#fff;stroke:#64748b;stroke-width:1.5;stroke-dasharray:4 3}
      .ucn{fill:#eff6ff;stroke:#1d4ed8;stroke-width:2.5}
      .ul{font-size:12.5px;font-weight:600;fill:#0f172a;text-anchor:middle}
      .al{font-size:12px;font-weight:700;fill:#0f172a;text-anchor:middle}
      .a{stroke:#475569;stroke-width:1.3}
      .inc{stroke:#2563eb;stroke-width:1.3;stroke-dasharray:6 4;fill:none}
      .ext{stroke:#475569;stroke-width:1.3;stroke-dasharray:6 4;fill:none}
      .st{font-size:10.5px;fill:#334155;font-style:italic}
      .note{fill:#fefce8;stroke:#a16207;stroke-width:1}
      .nt{font-size:11px;fill:#422006}
    </style>
    <g id="actor"><circle cx="0" cy="-34" r="11" fill="#fff" stroke="#1e293b" stroke-width="1.6"/><line x1="0" y1="-23" x2="0" y2="8" stroke="#1e293b" stroke-width="1.6"/><line x1="-18" y1="-12" x2="18" y2="-12" stroke="#1e293b" stroke-width="1.6"/><line x1="0" y1="8" x2="-14" y2="32" stroke="#1e293b" stroke-width="1.6"/><line x1="0" y1="8" x2="14" y2="32" stroke="#1e293b" stroke-width="1.6"/></g>
  </defs>

  <text x="600" y="28" text-anchor="middle" style="font-size:20px;font-weight:800;fill:#0f172a">Diagrama de Casos de Uso — Extensão Sprint 2 (UC16–UC23)</text>
  <text x="600" y="48" text-anchor="middle" class="st">Complementa uml/casos-de-uso.svg (UC01–UC15). Atores e casos de uso anteriores permanecem válidos.</text>

  <rect class="b" x="250" y="70" width="700" height="760" rx="12"/>
  <text class="t" x="600" y="98" text-anchor="middle">Sistema Conecta Intercâmbio — App (Explorar · Conversas · Unifor · Menu · Perfil)</text>

  <ellipse class="ucn" cx="450" cy="160" rx="150" ry="34"/><text class="ul" x="450" y="156">UC16: Conversar por Mensagens</text><text class="ul" x="450" y="172">Privadas e Grupos</text>
  <ellipse class="ucn" cx="450" cy="250" rx="150" ry="34"/><text class="ul" x="450" y="246">UC17: Buscar Perfis e</text><text class="ul" x="450" y="262">Gerenciar Conexões</text>
  <ellipse class="ucn" cx="450" cy="340" rx="150" ry="34"/><text class="ul" x="450" y="336">UC18: Explorar Guia da Cidade</text><text class="ul" x="450" y="352">e Fórum de Tópicos</text>
  <ellipse class="ucn" cx="450" cy="430" rx="150" ry="34"/><text class="ul" x="450" y="426">UC19: Personalizar Aparência</text><text class="ul" x="450" y="442">e Idioma</text>
  <ellipse class="ucn" cx="450" cy="520" rx="150" ry="34"/><text class="ul" x="450" y="516">UC20: Gerenciar Privacidade e</text><text class="ul" x="450" y="532">Consentimentos (LGPD)</text>
  <ellipse class="ucn" cx="450" cy="610" rx="150" ry="34"/><text class="ul" x="450" y="606">UC21: Consultar Notícias</text><text class="ul" x="450" y="622">do Meu Curso</text>
  <ellipse class="ucn" cx="450" cy="700" rx="150" ry="34"/><text class="ul" x="450" y="696">UC22: Assistir e Publicar</text><text class="ul" x="450" y="712">Reels Acadêmicos</text>
  <ellipse class="ucn" cx="790" cy="760" rx="140" ry="32"/><text class="ul" x="790" y="756">UC23: Publicar Notícias e</text><text class="ul" x="790" y="772">Reels Institucionais</text>

  <ellipse class="uc" cx="810" cy="160" rx="120" ry="28"/><text class="ul" x="810" y="157">UC13: Denunciar Conteúdo,</text><text class="ul" x="810" y="171">Comentário ou Perfil</text>
  <ellipse class="uc" cx="810" cy="340" rx="120" ry="28"/><text class="ul" x="810" y="337">UC15: Exibir Isenção Legal</text><text class="ul" x="810" y="351">em Dicas de Moradia</text>
  <ellipse class="uc" cx="810" cy="560" rx="120" ry="28"/><text class="ul" x="810" y="557">UC14: Moderar Conteúdos e</text><text class="ul" x="810" y="571">Processar Denúncias</text>
  <ellipse class="uc" cx="810" cy="650" rx="120" ry="28"/><text class="ul" x="810" y="647">UC06: Consultar Notícias</text><text class="ul" x="810" y="661">e Editais Oficiais</text>

  <use href="#actor" x="110" y="300"/><text class="al" x="110" y="352">Estudante da Unifor</text><text class="al" x="110" y="366">(Geral)</text>
  <use href="#actor" x="110" y="640"/><text class="al" x="110" y="692">Estudante Internacional</text><text class="al" x="110" y="706">(Incoming)</text>
  <use href="#actor" x="1100" y="550"/><text class="al" x="1100" y="602">Moderador</text><text class="al" x="1100" y="616">Comunitário</text>
  <use href="#actor" x="1100" y="760"/><text class="al" x="1100" y="812">Equipe de Comunicação</text><text class="al" x="1100" y="826">(TV Unifor / NEI / Coord.)</text>

  <line x1="110" y1="600" x2="110" y2="380" stroke="#1e293b" stroke-width="1.4" marker-end="url(#tri)"/>

  <g class="a">
    <line x1="128" y1="290" x2="302" y2="166"/>
    <line x1="128" y1="292" x2="300" y2="254"/>
    <line x1="128" y1="296" x2="300" y2="340"/>
    <line x1="128" y1="300" x2="302" y2="426"/>
    <line x1="128" y1="304" x2="306" y2="512"/>
    <line x1="128" y1="308" x2="312" y2="600"/>
    <line x1="128" y1="312" x2="318" y2="690"/>
    <line x1="1082" y1="540" x2="930" y2="560"/>
    <line x1="1082" y1="750" x2="930" y2="760"/>
  </g>

  <line class="ext" x1="690" y1="160" x2="602" y2="160" marker-end="url(#openg)"/>
  <text class="st" x="612" y="138">«extend»</text><text class="st" x="612" y="151">[denunciar conversa]</text>

  <line class="ext" x1="690" y1="340" x2="602" y2="340" marker-end="url(#openg)"/>
  <text class="st" x="612" y="318">«extend»</text><text class="st" x="612" y="331">[tópico de moradia]</text>

  <path class="inc" d="M600,615 L688,645" marker-end="url(#open)"/>
  <text class="st" x="612" y="642">«include»</text>

  <path class="inc" d="M598,600 C650,580 650,550 598,530" marker-end="url(#open)"/>
  <text class="st" x="636" y="568">«include»</text>

  <path class="inc" d="M590,688 C650,650 700,610 712,580" marker-end="url(#open)"/>
  <text class="st" x="612" y="690">«include» [post de estudante → fila]</text>

  <rect class="note" x="262" y="752" width="390" height="62" rx="6"/>
  <text class="nt" x="272" y="772">Reels/posts de estudantes só aparecem após moderação (RN06).</text>
  <text class="nt" x="272" y="788">Conversas: só conexões ou pedidos aceitos (RN11); moderação acessa</text>
  <text class="nt" x="272" y="804">apenas trechos denunciados (RN12). UC19/UC20 ficam na aba Menu.</text>
</svg>
